services:
  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      # Адрес API вместе с версией пути. host.docker.internal — бэкенд,
      # поднятый своим compose на этой же машине; в проде здесь домен.
      API_BASE_URL: ${API_BASE_URL:-http://host.docker.internal:8080/v1}
      LEGAL_REVALIDATE_SECONDS: ${LEGAL_REVALIDATE_SECONDS:-3600}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      NEXT_PUBLIC_SUPPORT_EMAIL: ${NEXT_PUBLIC_SUPPORT_EMAIL:-support@healthai.app}
      NEXT_PUBLIC_APP_VERSION: ${NEXT_PUBLIC_APP_VERSION:-0.1.0 (web)}
      SITE_DEVICE_ID: ${SITE_DEVICE_ID:-00000000-0000-4000-8000-000000000001}
    restart: unless-stopped
