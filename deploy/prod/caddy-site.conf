# Секция для /etc/caddy/Caddyfile на хосте — того самого, что уже держит
# 80 и 443 и обслуживает health-api.avavion.ru и остальные сайты машины.
#
# Добавляется один раз под root, дальше выкатка её не трогает: меняется
# только включаемый файл health-web-upstream.conf, в котором лежит адрес
# живого цвета. Сертификат Caddy выпустит сам, как для соседних доменов.
#
# Порядок установки — docs/DEPLOY.md, раздел 2.

app.avavion.ru {
	# Адрес живого цвета: 127.0.0.1:3110 (blue) или 127.0.0.1:3111 (green).
	# Файл переписывает deploy.sh, и только он.
	#
	# Пустым он быть не должен: Caddy до 2.6 отвергает import пустого файла
	# вместе со всей конфигурацией — то есть и с чужими сайтами машины. До
	# первой выкатки в нём лежит заглушка, см. docs/DEPLOY.md, раздел 2.4.
	#
	# Порты 3000 и 3001 на этой машине заняты — панелью наблюдения и соседом,
	# — поэтому цвета сайта живут выше. Диапазон задан в /opt/health-ai-web/.env;
	# поменяв его там, поправьте и здесь: Caddy стоит на хосте и .env не читает.
	import /etc/caddy/health-web-upstream.conf

	encode gzip

	# Сайт принимает только формы: обращение в поддержку, вход, запись еды.
	# Мегабайта хватает с запасом, а больше — либо ошибка, либо попытка
	# забить канал.
	request_body {
		max_size 1MB
	}

	header {
		Strict-Transport-Security "max-age=31536000; includeSubDomains"
		X-Content-Type-Options "nosniff"
		# Кликджекинг: страницы показывают дневник и формы входа, и встраивать
		# их в чужой фрейм незачем.
		X-Frame-Options "DENY"
		Referrer-Policy "strict-origin-when-cross-origin"
		# Имя и версия сервера наружу не нужны.
		-Server
		-X-Powered-By
	}

	# Статика Next неизменна: имя файла содержит хэш содержимого, и
	# перезапрашивать её при каждом заходе незачем.
	@immutable path /_next/static/*
	header @immutable Cache-Control "public, max-age=31536000, immutable"
}
