# Секция для /etc/caddy/Caddyfile на хосте — того самого, что уже держит
# 80 и 443 и обслуживает health-api.avavion.ru и остальные сайты машины.
#
# Добавляется один раз под root, дальше выкатка её не трогает: сайт всегда
# живёт на одном и том же адресе петли, менять там нечего. Сертификат Caddy
# выпустит сам, как для соседних доменов.
#
# Порядок установки — docs/DEPLOY.md, раздел 2.

healthai.avavion.ru {
	reverse_proxy 127.0.0.1:3100

	encode gzip

	# Сайт принимает только формы: обращение в поддержку и вход. Мегабайта
	# хватает с запасом, а больше — либо ошибка, либо попытка забить канал.
	request_body {
		max_size 1MB
	}

	header {
		Strict-Transport-Security "max-age=31536000; includeSubDomains"
		X-Content-Type-Options "nosniff"
		# Кликджекинг: страницы сайта показывают дневник и формы входа, и
		# встраивать их в чужой фрейм незачем.
		X-Frame-Options "DENY"
		Referer-Policy "strict-origin-when-cross-origin"
		# Имя и версия сервера наружу не нужны.
		-Server
		-X-Powered-By
	}

	# Статика Next неизменна: имя файла содержит хэш содержимого, и
	# перезапрашивать её при каждом заходе незачем.
	@immutable path /_next/static/*
	header @immutable Cache-Control "public, max-age=31536000, immutable"
}
