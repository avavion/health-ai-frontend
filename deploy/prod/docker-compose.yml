# Прод: два поколения сайта — blue и green. Цветами управляют deploy.sh и
# rollback.sh, руками этот файл поднимать не нужно.
#
# Схема та же, что у API (health-ai-backend/deploy/prod/docker-compose.yml), и
# по той же причине: 80 и 443 на машине держит Caddy, установленный на хосте,
# — он обслуживает API и другие сайты, и второй Caddy эти порты занять не
# смог бы. Поэтому цвета отдают себя на петлю, а хостовый Caddy проксирует на
# живой; переключением заведует deploy.sh.
#
# Базы у сайта нет: всё состояние живёт в API и в cookie у человека. Поэтому
# здесь нет ни postgres, ни томов, ни дампов перед выкаткой — только два
# контейнера, из которых один принимает трафик, а второй ждёт отката.
#
# Переменные подстановки (WEB_IMAGE_*, WEB_PORT_*) приходят из .env и
# images.env — оба файла живут только на сервере.
name: health-ai-web

x-web: &web
  restart: unless-stopped
  # Адрес API и настройки сайта — в site.env, он в git не попадает.
  env_file: [site.env]
  environment:
    NODE_ENV: production
  # Сайт держит только исходящие запросы к API; пятнадцати секунд на
  # завершение хватает с запасом.
  stop_grace_period: 15s
  mem_limit: 512m
  # Без ограничения журнал за пару месяцев съедает диск целиком.
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  web-blue:
    <<: *web
    image: ${WEB_IMAGE_BLUE:?не задан WEB_IMAGE_BLUE в images.env}
    container_name: health-ai-web-blue
    # Порт открыт только на петле. По нему deploy.sh проверяет здоровье
    # нового цвета до переключения, и на него же ходит хостовый Caddy.
    # Снаружи он недоступен.
    #
    # 3110 и 3111 по умолчанию: 3000 на этой машине держит панель наблюдения,
    # 3001 занят соседом. Внутри контейнера Next слушает свои 3000 — это
    # разные вещи, и конфликта тут нет.
    ports:
      - "127.0.0.1:${WEB_PORT_BLUE:-3110}:3000"

  web-green:
    <<: *web
    image: ${WEB_IMAGE_GREEN:?не задан WEB_IMAGE_GREEN в images.env}
    container_name: health-ai-web-green
    ports:
      - "127.0.0.1:${WEB_PORT_GREEN:-3111}:3000"
