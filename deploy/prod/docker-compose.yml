# Прод: сайт одним контейнером рядом с API.
#
# Без blue/green, в отличие от бэкенда. Причина не в экономии: у сайта нет ни
# базы, ни миграций, ни долгих запросов — переключать нечего, а перезапуск
# занимает секунды. Цена простоя — несколько секунд на выкатке, и платить за
# её отсутствие вторым поколением и переписыванием конфигурации Caddy тут не
# за что.
#
# Порт открыт только на петле: 80 и 443 держит Caddy, установленный на хосте,
# и он же проксирует на этот адрес. Снаружи 3100 недоступен.
name: health-ai-web

services:
  web:
    image: ${WEB_IMAGE:?не задан WEB_IMAGE в images.env}
    container_name: health-ai-web
    restart: unless-stopped
    # Секреты и адреса — в site.env, он в git не попадает.
    env_file: [site.env]
    environment:
      NODE_ENV: production
    ports:
      - "127.0.0.1:${WEB_PORT:-3100}:3000"
    # Сайт держит только исходящие запросы к API; десяти секунд на завершение
    # хватает с запасом.
    stop_grace_period: 15s
    mem_limit: 512m
    # Без ограничения журнал за пару месяцев съедает диск целиком.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
